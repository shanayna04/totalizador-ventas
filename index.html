<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Totalizador de Ventas</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 30px; line-height: 1.6; }
      .form-group { margin-bottom: 12px; }
      label { display: inline-block; width: 200px; font-weight: bold; }
      input, select { padding: 6px; width: 220px; }
      button { padding: 8px 16px; margin-top: 10px; cursor: pointer; }
      #resultado-div { margin-top: 25px; padding: 15px; border: 1px solid #ddd; max-width: 450px; background-color: #f9f9f9; }
      .error { color: #d9534f; font-weight: bold; }
      .total-final { font-size: 1.2em; color: #2e7d32; font-weight: bold; }
    </style>
  </head>
  <body>
    <h1>Totalizador de Ventas</h1>
    <form id="totalizador-form">
      <div class="form-group">
        <label for="cantidad">Cantidad de items:</label>
        <input type="number" id="cantidad" value="20" required />
      </div>

      <div class="form-group">
        <label for="precio">Precio por item ($):</label>
        <input type="number" id="precio" step="0.01" value="3" required />
      </div>

      <div class="form-group">
        <label for="estado">Estado (USA):</label>
        <select id="estado">
          <option value="CA" selected>CA (8.25%)</option>
          <option value="TX">TX (6.25%)</option>
          <option value="UT">UT (6.65%)</option>
          <option value="NV">NV (8.00%)</option>
          <option value="AL">AL (4.00%)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="categoria">Categoría:</label>
        <select id="categoria">
          <option value="Varios" selected>Varios</option>
          <option value="Alimentos">Alimentos</option>
          <option value="Bebidas alcoholicas">Bebidas alcohólicas</option>
          <option value="Material de escritorio">Material de escritorio</option>
          <option value="Muebles">Muebles</option>
          <option value="Electronicos">Electrónicos</option>
          <option value="Vestimenta">Vestimenta</option>
        </select>
      </div>

      <div class="form-group">
        <label for="peso">Peso volumétrico unitario:</label>
        <input type="number" id="peso" step="0.1" value="0" required />
      </div>

      <div class="form-group">
        <label for="cliente">Tipo de cliente:</label>
        <select id="cliente">
          <option value="Normal" selected>Normal</option>
          <option value="Recurrente">Recurrente</option>
          <option value="Antiguo Recurrente">Antiguo Recurrente</option>
          <option value="Especial">Especial</option>
        </select>
      </div>

      <button type="submit" id="totalizar-button">Totalizar</button>
    </form>

    <div id="resultado-div"></div>

    <script type="module" src="./src/presenter.js"></script>
  </body>
</html>
